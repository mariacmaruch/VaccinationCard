<!-- AUTH -->
<app-auth *ngIf="!isLoggedIn" (loggedIn)="onLoggedIn($event)"></app-auth>

<!-- APP SHELL -->
<div *ngIf="isLoggedIn">
  <nav>
    <div class="nav-brand">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="7" fill="#EEF5FF"/>
        <path d="M14 5C9.03 5 5 9.03 5 14s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9z" fill="#1A7CFF" opacity=".25"/>
        <path d="M13 17.5l-2.5-2.5.9-.9 1.6 1.6 4.1-4.1.9.9-5 5z" fill="#1A7CFF"/>
        <circle cx="20" cy="8" r="2" fill="#00C896"/>
      </svg>
      Cartão de Vacinação
    </div>
    <div class="nav-user">
      Olá, <span>{{ currentUser.userName }}</span>
      <button class="btn btn-outline" style="padding:0.4rem 0.8rem;font-size:0.8rem" (click)="logout()">Sair</button>
    </div>
  </nav>

  <div class="layout">
    <aside>
      <div class="aside-section">Navegação</div>
      <button class="nav-item" [class.active]="page==='dashboard'" (click)="navigate('dashboard')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-item" [class.active]="page==='cartao'" (click)="navigate('cartao')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0120 9.414V19a2 2 0 01-2 2z"/></svg>
        Meu Cartão
      </button>
      <button class="nav-item" [class.active]="page==='registrar'" (click)="navigate('registrar')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Registrar Vacina
      </button>
      <div class="aside-section" style="margin-top:1rem">Admin</div>
      <button class="nav-item" [class.active]="page==='vacinas'" (click)="navigate('vacinas')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        Cadastrar Vacina
      </button>
      <button class="nav-item" [class.active]="page==='conta'" (click)="navigate('conta')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Minha Conta
      </button>
    </aside>

    <main>
      <app-dashboard *ngIf="page==='dashboard'" [cartao]="cartao" [currentUser]="currentUser"></app-dashboard>
      <app-cartao *ngIf="page==='cartao'" [cartao]="cartao" [cartaoMsg]="cartaoMsg" (deleteRequest)="onDeleteRequest($event)"></app-cartao>
      <app-registrar *ngIf="page==='registrar'" [contaId]="currentUser.contaId" (vacinacaoRegistrada)="loadCartao()"></app-registrar>      
      <app-vacinas *ngIf="page==='vacinas'"></app-vacinas>
      <app-conta *ngIf="page==='conta'" [currentUser]="currentUser" (contaRemoved)="logout()"></app-conta>
    </main>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" *ngIf="deleteTarget">
  <div class="modal-box">
    <h2>Confirmar exclusão</h2>
    <p>Deseja excluir o registro de <strong>{{ deleteTarget.nomeVacina }}</strong> (Dose {{ deleteTarget.dose }})? Esta ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" (click)="cancelDelete()">Cancelar</button>
      <button class="btn btn-danger" (click)="confirmDelete()" [disabled]="deleteLoading">
        <span class="spinner" *ngIf="deleteLoading" style="border-color:rgba(229,57,53,.3);border-top-color:var(--danger)"></span>
        <span *ngIf="!deleteLoading">Excluir</span>
      </button>
    </div>
  </div>
</div>
