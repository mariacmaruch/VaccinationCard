<h1>Cadastrar Vacina</h1>
<p class="page-subtitle">Adicione novas vacinas ao sistema</p>

<div class="card">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    Nova vacina
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label>Nome da vacina</label>
      <input type="text" [(ngModel)]="nome" placeholder="Ex: COVID-19, Influenza, Hepatite B..." />
    </div>
  </div>
  <div class="alert" *ngIf="msg" [class.alert-success]="msgOk" [class.alert-error]="!msgOk">{{ msg }}</div>
  <div class="btn-row">
    <button class="btn btn-primary" (click)="cadastrar()" [disabled]="loading">
      <span class="spinner" *ngIf="loading"></span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Cadastrar vacina
    </button>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
    Vacinas disponíveis ({{ vacinas.length }})
  </div>
  <div class="empty-state" *ngIf="vacinas.length === 0">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517"/></svg>
    <p>Nenhuma vacina cadastrada. Adicione a primeira acima.</p>
  </div>
  <div class="table-wrap" *ngIf="vacinas.length > 0">
    <table>
      <thead><tr><th>#</th><th>Nome da vacina</th></tr></thead>
      <tbody>
        <tr *ngFor="let v of vacinas">
          <td><span class="badge badge-blue">{{ v.vacinaId }}</span></td>
          <td>{{ v.nomeVacina }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
