<h1>Registrar Vacinação</h1>
<p class="page-subtitle">Adicione um novo registro de vacina ao seu cartão</p>

<div class="card">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    Nova vacinação
  </div>
  <div class="form-grid form-grid-2">
    <div class="form-group" style="grid-column:1/-1">
      <label>Vacina</label>
      <select [(ngModel)]="vacForm.vacinaId">
        <option [ngValue]="0">— selecione uma vacina —</option>
        <option *ngFor="let v of vacinas" [ngValue]="v.vacinaId">
          {{ v.nomeVacina }}
        </option>
      </select>
      <div style="margin-top:0.4rem;font-size:0.78rem;color:var(--text-muted)">
        ID da conta: <strong>{{ contaId }}</strong> (preenchido automaticamente)
      </div>
    </div>
    <div class="form-group">
      <label>Dose</label>
      <input type="number" [(ngModel)]="vacForm.dose" placeholder="Ex: 1" min="1" />
    </div>
  </div>
  <div class="alert" *ngIf="vacMsg" [class.alert-success]="vacOk" [class.alert-error]="!vacOk">{{ vacMsg }}</div>
  <div class="btn-row">
    <button class="btn btn-primary" (click)="registrar()" [disabled]="loading">
      <span class="spinner" *ngIf="loading"></span>
      <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Registrar
    </button>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517"/></svg>
    Registrar vacinação de outra conta
  </div>
  <div class="form-grid form-grid-2">
    <div class="form-group">
      <label>ID da conta</label>
      <input type="number" [(ngModel)]="vacFormOther.contaId" placeholder="ID da conta" />
    </div>
    <div class="form-group">
      <label>Vacina</label>
      <select [(ngModel)]="vacFormOther.vacinaId">
        <option [ngValue]="0">— selecione —</option>
        <option *ngFor="let v of vacinas" [ngValue]="v.vacinaId">
          {{ v.nomeVacina }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Dose</label>
      <input type="number" [(ngModel)]="vacFormOther.dose" placeholder="Ex: 1" min="1" />
    </div>
  </div>
  <div class="alert" *ngIf="vacMsgOther" [class.alert-success]="vacOkOther" [class.alert-error]="!vacOkOther">{{ vacMsgOther }}</div>
  <div class="btn-row">
    <button class="btn btn-outline" (click)="registrarOutra()" [disabled]="loading">
      Registrar para outra conta
    </button>
  </div>
</div>
