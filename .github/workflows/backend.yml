name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"

  pull_request:
    branches: ["master"]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend/VaccinationCard.slnx

      - name: Build
        run: dotnet build backend/VaccinationCard.slnx --no-restore

      - name: Test
        run: dotnet test backend/VaccinationCard.slnx --no-build --verbosity normal
